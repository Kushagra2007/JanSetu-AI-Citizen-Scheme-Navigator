{% extends "base.html" %}
{% block title %}Notifications — Citizen Service Navigator{% endblock %}
{% block content %}
<div class="container" style="padding:20px 20px 60px;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2>🔔 Notifications</h2>
    <div style="display:flex;gap:10px;">
      <button id="enablePushBtn" class="btn btn-outline">Enable Browser Push</button>
      <button id="markAllBtn" class="btn btn-secondary">Mark All Read</button>
    </div>
  </div>
  <div id="notifList" style="margin-top:20px;display:flex;flex-direction:column;gap:14px;"></div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/notifications.js"></script>{% endblock %}
