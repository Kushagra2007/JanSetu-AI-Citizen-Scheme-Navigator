{% extends "base.html" %}
{% block title %}Register — Citizen Service Navigator{% endblock %}
{% block content %}
<div class="container">
  <div class="glass auth-card">
    <h2 style="margin-bottom:20px;text-align:center;">Create Your Account 🚀</h2>
    <div id="errorBox" class="badge badge-red" style="display:none;margin-bottom:14px;width:100%;padding:10px;"></div>
    <form id="registerForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="name" class="form-control" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" class="form-control" required></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="phone" class="form-control"></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" class="form-control" required></div>
      <div class="form-group">
        <label>Preferred Language</label>
        <select id="language_pref" class="form-control">
          <option value="en">English</option>
          <option value="hi">हिन्दी (Hindi)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:18px;color:var(--text-muted);">
      Already registered? <a href="/login" style="color:var(--orange-dark);font-weight:600;">Login</a>
    </p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/auth.js"></script>{% endblock %}
