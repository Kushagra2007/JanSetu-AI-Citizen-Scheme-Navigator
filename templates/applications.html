{% extends "base.html" %}
{% block title %}Service Pathway — Citizen Service Navigator{% endblock %}
{% block content %}
<div class="container" style="padding:20px 20px 60px;">
  <h2 id="serviceTitle">Loading...</h2>
  <div style="display:flex;gap:12px;margin:14px 0;">
    <button id="startAppBtn" class="btn btn-primary">📋 Track This Application</button>
    <button id="listenAllBtn" class="btn btn-secondary">🔊 Listen to All Steps</button>
    <select id="langSelect" class="form-control" style="width:auto;"><option value="en">English</option><option value="hi">हिन्दी</option></select>
  </div>
  <div id="stepsContainer"></div>
</div>
{% endblock %}
{% block scripts %}
<script>const SERVICE_ID = {{ service_id }};</script>
<script src="/static/js/voice.js"></script>
<script src="/static/js/service.js"></script>
{% endblock %}
