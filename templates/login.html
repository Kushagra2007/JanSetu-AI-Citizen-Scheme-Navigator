{% extends "base.html" %}
{% block title %}Login — Citizen Service Navigator{% endblock %}
{% block content %}
<div class="container">
  <div class="glass auth-card">
    <h2 style="margin-bottom:20px;text-align:center;">Welcome Back 👋</h2>
    <div id="errorBox" class="badge badge-red" style="display:none;margin-bottom:14px;width:100%;padding:10px;"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Login</button>
    </form>
    <p style="text-align:center;margin-top:18px;color:var(--text-muted);">
      Don't have an account? <a href="/register" style="color:var(--orange-dark);font-weight:600;">Register</a>
    </p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/auth.js"></script>{% endblock %}
