{% extends "base.html" %}
{% block title %}Schemes — Citizen Service Navigator{% endblock %}
{% block content %}
<div class="container" style="padding:20px 20px 60px;">
  <h2>🎯 Recommended Schemes</h2>
  <div class="glass card" style="margin:18px 0;display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
    <select id="categoryFilter" class="form-control" style="width:auto;">
      <option value="">All Categories</option>
      <option>Agriculture</option><option>Scholarship</option><option>Healthcare</option>
      <option>Housing</option><option>Welfare</option><option>Pension</option>
      <option>Financial Inclusion</option><option>Employment</option><option>Skill Development</option>
    </select>
    <div style="flex:1;min-width:200px;">
      <label style="font-size:0.85rem;">Minimum Match Score</label>
      <input type="range" id="scoreFilter" min="0" max="100" value="0" style="width:100%;">
    </div>
  </div>
  <div id="schemesGrid" class="grid grid-3"></div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/schemes.js"></script>{% endblock %}
