{% extends "base.html" %}
{% block title %}Schemes — JanSetu{% endblock %}
{% block content %}
<main class="container" style="padding:20px 20px 60px;">
  <h2>Recommended schemes</h2>
  <div class="glass card" style="margin:18px 0;display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
    <input id="schemeSearch" class="form-control" style="min-width:220px;flex:1" type="search" placeholder="Search scholarships, farmers, housing…" aria-label="Search schemes">
    <select id="categoryFilter" class="form-control" style="width:auto;"><option value="">All categories</option><option>Agriculture</option><option>Scholarship</option><option>Healthcare</option><option>Housing</option><option>Welfare</option><option>Pension</option><option>Financial Inclusion</option><option>Employment</option><option>Skill Development</option></select>
    <div style="flex:1;min-width:200px;"><label style="font-size:.85rem;">Minimum match score</label><input type="range" id="scoreFilter" min="0" max="100" value="0" style="width:100%;"></div>
  </div>
  <div id="schemesGrid" class="grid grid-3"></div>
</main>
{% endblock %}
{% block scripts %}<script src="/static/js/schemes.js"></script>{% endblock %}
